<div class="auth-page">
  <div class="login-card fade-in">
    <div class="login-header">
      <h1>FARMASALUD</h1>
      <p>INGRESO AL SISTEMA</p>
    </div>

    <!-- Usamos tu username como debe ser -->
    <form (ngSubmit)="onLogin()">
      <div class="input-group">
        <label>Nombre de Usuario</label>
        <input type="text" [(ngModel)]="credentials.username" name="username" 
               placeholder="Ej: l-alvarado" required>
      </div>

      <div class="input-group">
        <label>Contraseña</label>
        <input type="password" [(ngModel)]="credentials.password" name="password" 
               placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-primary">
        ENTRAR AL PANEL
      </button>
    </form>

    <div class="login-footer">
      <span>© 2026 Trujillo, Perú</span>
    </div>
  </div>
</div>
